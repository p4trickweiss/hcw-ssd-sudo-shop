services:
  app:
    build:
      context: .
      args:
        APP_ORIGIN: http://127.0.0.1
    environment:
      DATABASE_URL: postgresql://sudo:sudo_local_only@db:5432/sudo_shop
      SECURE_MODE: ${SECURE_MODE:-false}
    ports:
      - '80:3000'
    volumes:
      - flags_data:/app/local
    user: node
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    networks:
      - default
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sudo
      POSTGRES_PASSWORD: sudo_local_only
      POSTGRES_DB: sudo_shop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sudo -d sudo_shop']
      interval: 3s
      timeout: 3s
      retries: 15
networks:
  default: {}
  backend:
    internal: true
volumes:
  postgres_data:
  flags_data:
